<!-- Diagnóstico Rápido de Expertise — versão para systeme.io
     Cole todo este conteúdo em um elemento de código HTML personalizado (Custom Code) de uma seção em largura total. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap');
#expertise-kit{all:initial;display:block;}
#expertise-kit h4,#expertise-kit p,#expertise-kit label,#expertise-kit span,#expertise-kit div,#expertise-kit li,#expertise-kit small,#expertise-kit b,#expertise-kit i{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:inherit;}
#expertise-kit p,#expertise-kit label,#expertise-kit span,#expertise-kit div,#expertise-kit li{font-weight:inherit;}
#expertise-kit h4{font-weight:700;}
#expertise-kit ul{list-style:disc;}
#expertise-kit input,#expertise-kit textarea{height:auto;min-height:0;max-height:none;margin:0;}
#expertise-kit input,#expertise-kit textarea,#expertise-kit button{text-transform:none;letter-spacing:normal;word-spacing:normal;text-indent:0;text-shadow:none;}
#expertise-kit header{display:block;position:static;float:none;width:auto;height:auto;min-height:0;border:0;box-shadow:none;background:none;transform:none;}
#expertise-kit{
  --bg:#fbf7ef; --card:#ffffff; --cream:#faf2e1; --sand:#f3e9d4; --border:#e6d9c1; --border2:#d3c3a4;
  --brown:#8a7456; --brown-d:#5e4d38; --ink:#2b2418; --text:#3d3426; --muted:#6f6454;
  --green:#2f7d4b; --green-l:#e6f3ea; --green-b:#9ccdb0;
  --yellow:#8f6c00; --yellow-l:#fbf3d6; --yellow-b:#e2c866;
  --orange:#b05512; --orange-l:#fbeadb; --orange-b:#e8b284;
  --red:#a8352c; --red-l:#fae3e0; --red-b:#e3a39d;
  --shadow:0 2px 20px rgba(60,45,25,.08);
}
#expertise-kit,#expertise-kit *{box-sizing:border-box;margin:0;padding:0}
#expertise-kit{font-family:'Fira Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.65}
#expertise-kit .band-green{--c:var(--green);--cl:var(--green-l);--cb:var(--green-b)}
#expertise-kit .band-yellow{--c:var(--yellow);--cl:var(--yellow-l);--cb:var(--yellow-b)}
#expertise-kit .band-orange{--c:var(--orange);--cl:var(--orange-l);--cb:var(--orange-b)}
#expertise-kit .band-red{--c:var(--red);--cl:var(--red-l);--cb:var(--red-b)}
#expertise-kit .hero{display:flex;min-height:190px;background:var(--cream);overflow:hidden;position:relative}
#expertise-kit .hero-art{flex:0 0 26%;max-width:250px;background:var(--brown);display:flex;align-items:center;justify-content:center;position:relative}
#expertise-kit .hero-art::after{content:'';position:absolute;right:-70px;top:-40px;bottom:-40px;width:130px;border-radius:50%;background:var(--cream)}
#expertise-kit .hero-art svg{width:92px;height:92px;position:relative;z-index:1;margin-right:26px}
#expertise-kit .hero-txt{flex:1;padding:34px 28px 34px 40px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:2}
#expertise-kit .hero-title{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(22px,4.4vw,40px);letter-spacing:1px;text-transform:uppercase;color:var(--brown);line-height:1.15}
#expertise-kit .hero-sub{font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brown);max-width:460px;line-height:1.65}
#expertise-kit .wrap{max-width:800px;margin:0 auto;padding:28px 16px 90px}
#expertise-kit .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:28px;margin-bottom:20px;animation:ExpertiseKitFadeUp .35s ease}
@keyframes ExpertiseKitFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#expertise-kit .eyebrow{font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brown);margin-bottom:8px;font-weight:500}
#expertise-kit .h2{font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(20px,3.2vw,26px);color:var(--ink);line-height:1.25;margin-bottom:10px}
#expertise-kit .h3{font-family:'Poppins',sans-serif;font-weight:500;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--brown-d);margin-bottom:12px}
#expertise-kit .lead{color:var(--muted);margin-bottom:14px}
#expertise-kit .sub{font-size:15px;color:var(--muted)}
#expertise-kit .divider{height:1px;background:var(--border);margin:18px 0}
#expertise-kit .pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
#expertise-kit .pill{font-family:'Poppins',sans-serif;font-size:12px;padding:6px 14px;border-radius:99px;background:var(--cream);border:1px solid var(--border);color:var(--brown-d)}
#expertise-kit .steps-howto{list-style:none;margin:6px 0 4px}
#expertise-kit .steps-howto li{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
#expertise-kit .steps-howto .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brown);color:#fff;font-family:'Poppins',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
#expertise-kit .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
#expertise-kit .legend div{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35}
#expertise-kit .legend b{display:block;font-family:'Poppins',sans-serif;font-size:13px}
#expertise-kit .lg0{background:var(--red-l);color:var(--red)}
#expertise-kit .lg1{background:var(--yellow-l);color:var(--yellow)}
#expertise-kit .lg2{background:var(--green-l);color:var(--green)}
#expertise-kit .privacy{font-size:13px;color:var(--muted);margin-top:14px}
#expertise-kit .fld{margin-bottom:16px}
#expertise-kit .fld label{display:block;font-weight:600;color:var(--ink);margin-bottom:6px;font-size:16px}
#expertise-kit .fld .prefix{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:6px}
#expertise-kit .fld input[type=text],#expertise-kit .fld textarea{width:100%;padding:13px 14px;border:1.5px solid var(--border2);border-radius:10px;font-family:'Fira Sans',sans-serif;font-size:16px;color:var(--ink);background:#fffdf9;outline:none;transition:border-color .2s,box-shadow .2s}
#expertise-kit .fld textarea{min-height:92px;resize:vertical}
#expertise-kit .fld input:focus,#expertise-kit .fld textarea:focus{border-color:var(--brown);box-shadow:0 0 0 3px rgba(138,116,86,.18);background:#fff}
#expertise-kit .fld input::placeholder,#expertise-kit .fld textarea::placeholder{color:#b3a791}
#expertise-kit .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:500;font-size:15px;cursor:pointer;border:1.5px solid transparent;transition:all .2s;min-height:48px;line-height:1.2}
#expertise-kit .btn-primary{background:var(--brown);color:#fff}
#expertise-kit .btn-primary:hover{background:var(--brown-d)}
#expertise-kit .btn-ghost{background:#fff;color:var(--brown-d);border-color:var(--border2)}
#expertise-kit .btn-ghost:hover{border-color:var(--brown);background:var(--cream)}
#expertise-kit .btn-green{background:var(--green);color:#fff}
#expertise-kit .btn-green:hover{background:#25663c}
#expertise-kit .btn-sm{padding:10px 16px;min-height:42px;font-size:14px}
#expertise-kit .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
#expertise-kit .btn-row .grow{flex:1}
#expertise-kit .prog{position:sticky;top:0;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
#expertise-kit .prog-top{display:flex;justify-content:space-between;gap:10px;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
#expertise-kit .track{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}
#expertise-kit .fill{height:100%;background:linear-gradient(90deg,var(--brown),#b79d78);border-radius:99px;transition:width .4s}
#expertise-kit .dots{display:flex;gap:5px;margin-top:10px}
#expertise-kit .dot{flex:1;height:5px;border-radius:99px;background:var(--sand)}
#expertise-kit .dot.done{background:var(--green)}
#expertise-kit .dot.cur{background:var(--brown)}
#expertise-kit .item{border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;background:#fffdf9;transition:border-color .2s,background .2s}
#expertise-kit .item.missing{border-color:var(--red);background:var(--red-l)}
#expertise-kit .q{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
#expertise-kit .q .n{flex:0 0 28px;height:28px;border-radius:8px;background:var(--sand);color:var(--brown-d);font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
#expertise-kit .q p{color:var(--ink);font-size:17px;line-height:1.5}
#expertise-kit .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#expertise-kit .opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:8px 6px;border-radius:10px;border:1.5px solid var(--border2);background:#fff;color:var(--text);cursor:pointer;font-family:'Fira Sans',sans-serif;font-size:15px;transition:all .15s;text-align:center;line-height:1.25}
#expertise-kit .opt b{font-weight:600}
#expertise-kit .opt small{font-size:12px;color:var(--muted)}
#expertise-kit .opt:hover{border-color:var(--brown);background:var(--cream)}
#expertise-kit .opt.on.o0{border-color:var(--red);background:var(--red-l);color:var(--red)}
#expertise-kit .opt.on.o1{border-color:var(--yellow);background:var(--yellow-l);color:var(--yellow)}
#expertise-kit .opt.on.o2{border-color:var(--green);background:var(--green-l);color:var(--green)}
#expertise-kit .opt.on small{color:inherit}
#expertise-kit .subtotal{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border-radius:10px;padding:12px 16px;margin-top:6px;font-family:'Poppins',sans-serif;font-size:14px;color:var(--brown-d)}
#expertise-kit .subtotal b{font-size:20px}
#expertise-kit .warn{display:none;background:var(--red-l);border:1px solid var(--red-b);color:var(--red);border-radius:10px;padding:12px 14px;margin-top:14px;font-weight:600;font-size:15px}
#expertise-kit .warn.show{display:block}
#expertise-kit .score{text-align:center}
#expertise-kit .score-num{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(54px,12vw,84px);line-height:1;color:var(--c)}
#expertise-kit .score-num small{font-size:.38em;font-weight:400;color:var(--muted)}
#expertise-kit .scale{position:relative;height:14px;border-radius:99px;display:flex;overflow:hidden;margin:26px 0 8px}
#expertise-kit .scale i{display:block;height:100%}
#expertise-kit .sc-r{background:#d9847c;width:35.71%}
#expertise-kit .sc-o{background:#e8a566;width:21.43%}
#expertise-kit .sc-y{background:#e6cd6f;width:21.43%}
#expertise-kit .sc-g{background:#7fbf95;width:21.43%}
#expertise-kit .scale-wrap{position:relative}
#expertise-kit .marker{position:absolute;top:-8px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--ink);transform:translateX(-50%)}
#expertise-kit .scale-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:'Poppins',sans-serif}
#expertise-kit .badge{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:10px 18px;border-radius:99px;background:var(--cl);border:1.5px solid var(--cb);color:var(--c);font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.6px}
#expertise-kit .resumo{font-size:19px;color:var(--ink);margin:14px auto 0;max-width:560px;line-height:1.5}
#expertise-kit .hist{font-size:14px;color:var(--muted);margin-top:12px}
#expertise-kit .acao{text-align:left;margin-top:20px;background:var(--cl);border:1px solid var(--cb);border-radius:12px;padding:16px 18px}
#expertise-kit .acao b{display:block;font-family:'Poppins',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--c);margin-bottom:6px}
#expertise-kit .acao ul{list-style:none}
#expertise-kit .acao li{padding:3px 0 3px 24px;position:relative;color:var(--ink)}
#expertise-kit .acao li::before{content:'→';position:absolute;left:0;color:var(--c);font-weight:700}
#expertise-kit .dim{display:grid;grid-template-columns:minmax(120px,38%) 1fr 52px;gap:12px;align-items:center;padding:8px 0}
#expertise-kit .dim .nm{font-size:15px;color:var(--ink);line-height:1.3}
#expertise-kit .dim .bar{height:12px;background:var(--sand);border-radius:99px;overflow:hidden}
#expertise-kit .dim .bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
#expertise-kit .dim .val{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;color:var(--c);text-align:right}
#expertise-kit .adj{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fffdf9}
#expertise-kit .adj-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:'Fira Sans',sans-serif;font-size:16px;color:var(--ink);font-weight:600;min-height:52px}
#expertise-kit .adj-h span.cnt{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--cl);color:var(--c);white-space:nowrap}
#expertise-kit .adj-b{display:none;padding:2px 16px 14px}
#expertise-kit .adj.open .adj-b{display:block}
#expertise-kit .adj.open .adj-h .arr{transform:rotate(180deg)}
#expertise-kit .arr{transition:transform .2s;color:var(--muted)}
#expertise-kit .ai{display:flex;gap:10px;padding:7px 0;font-size:16px;color:var(--text);border-top:1px dashed var(--border)}
#expertise-kit .ai:first-child{border-top:none}
#expertise-kit .ai .ic{flex:0 0 22px;font-weight:700}
#expertise-kit .ai.z0 .ic{color:var(--red)}
#expertise-kit .ai.z1 .ic{color:var(--yellow)}
#expertise-kit .allok{color:var(--green);font-weight:600;padding:10px 0}
#expertise-kit .diag-g{margin:10px 0}
#expertise-kit .diag-g b{display:block;color:var(--ink);margin-bottom:2px}
#expertise-kit .diag-g ul,#expertise-kit .plain-ul{list-style:none}
#expertise-kit .diag-g li,#expertise-kit .plain-ul li{padding:3px 0 3px 22px;position:relative}
#expertise-kit .diag-g li::before,#expertise-kit .plain-ul li::before{content:'•';position:absolute;left:6px;color:var(--brown);font-weight:700}
#expertise-kit .dont li::before{content:'✘';color:var(--red);left:0}
#expertise-kit .callout{border-radius:12px;padding:14px 18px;margin:14px 0;background:var(--cream);border:1px solid var(--border);color:var(--ink)}
#expertise-kit .callout b{color:var(--brown-d)}
#expertise-kit .callout.cl-green{background:var(--green-l);border-color:var(--green-b)}
#expertise-kit .callout.cl-red{background:var(--red-l);border-color:var(--red-b)}
#expertise-kit .callout.cl-yellow{background:var(--yellow-l);border-color:var(--yellow-b)}
#expertise-kit .plan-prog{display:flex;align-items:center;gap:14px;background:var(--cream);border-radius:12px;padding:12px 16px;margin:6px 0 18px}
#expertise-kit .plan-prog .track{flex:1}
#expertise-kit .plan-prog .txt{font-family:'Poppins',sans-serif;font-size:13px;color:var(--brown-d);white-space:nowrap}
#expertise-kit .step{border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;background:#fffdf9}
#expertise-kit .step-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
#expertise-kit .step-h .sn{flex:0 0 32px;height:32px;border-radius:50%;background:var(--brown);color:#fff;font-family:'Poppins',sans-serif;font-weight:500;display:flex;align-items:center;justify-content:center}
#expertise-kit .step-h .st{font-weight:600;color:var(--ink);font-size:17px;line-height:1.35}
#expertise-kit .step-h .ss{font-size:15px;color:var(--muted)}
#expertise-kit .chk-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;margin:8px 0;cursor:pointer;background:#fff;transition:all .15s;color:var(--ink)}
#expertise-kit .chk-row:hover{border-color:var(--brown)}
#expertise-kit .chk-row input{width:22px;height:22px;margin-top:2px;flex:0 0 22px;accent-color:var(--green);cursor:pointer}
#expertise-kit .chk-row.on{background:var(--green-l);border-color:var(--green-b)}
#expertise-kit .chk-row.diagrow.on{background:var(--yellow-l);border-color:var(--yellow-b)}
#expertise-kit .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
#expertise-kit .chip{padding:11px 20px;border-radius:99px;border:1.5px solid var(--border2);background:#fff;font-family:'Fira Sans',sans-serif;font-size:16px;color:var(--text);cursor:pointer;min-height:46px;transition:all .15s}
#expertise-kit .chip:hover{border-color:var(--brown)}
#expertise-kit .chip.on{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:600}
#expertise-kit .list{margin:8px 0}
#expertise-kit .list .li{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:#fff}
#expertise-kit .li-n{flex:0 0 26px;height:26px;border-radius:7px;background:var(--sand);color:var(--brown-d);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif}
#expertise-kit .li-t{flex:1;color:var(--ink);word-break:break-word}
#expertise-kit .li-b{display:flex;gap:4px}
#expertise-kit .ico{width:38px;height:38px;border-radius:8px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-size:16px;color:var(--brown-d);display:flex;align-items:center;justify-content:center}
#expertise-kit .ico:hover{background:var(--cream);border-color:var(--brown)}
#expertise-kit .ico[disabled]{opacity:.35;cursor:default}
#expertise-kit .list-empty{font-size:15px;color:var(--muted);padding:6px 2px}
#expertise-kit .list-count{font-size:13px;color:var(--muted);font-family:'Poppins',sans-serif;margin:4px 2px 8px}
#expertise-kit .list-add{display:flex;gap:8px;flex-wrap:wrap}
#expertise-kit .list-add input{flex:1;min-width:180px;padding:12px 14px;border:1.5px solid var(--border2);border-radius:10px;font-family:'Fira Sans',sans-serif;font-size:16px;color:var(--ink);background:#fffdf9;outline:none}
#expertise-kit .list-add input:focus{border-color:var(--brown);box-shadow:0 0 0 3px rgba(138,116,86,.18)}
#expertise-kit .dec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border2);background:#fff;cursor:pointer;margin:8px 0;font-family:'Fira Sans',sans-serif;font-size:17px;color:var(--ink);min-height:56px;transition:all .15s}
#expertise-kit .dec:hover{border-color:var(--brown);background:var(--cream)}
#expertise-kit .dec .rd{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:#fff}
#expertise-kit .dec.on{border-color:var(--brown);background:var(--cream)}
#expertise-kit .dec.on .rd{border-color:var(--brown);background:radial-gradient(circle,var(--brown) 0 45%,#fff 50%)}
#expertise-kit .dec .sug{margin-left:auto;font-size:12px;font-family:'Poppins',sans-serif;color:var(--green);background:var(--green-l);border:1px solid var(--green-b);padding:2px 10px;border-radius:99px;white-space:nowrap}
#expertise-kit .dec-fb{margin-top:12px}
#expertise-kit .cta{background:linear-gradient(135deg,var(--brown-d),var(--brown));border-radius:14px;padding:26px;color:#fff;margin-bottom:20px}
#expertise-kit .cta .h3{color:#fff}
#expertise-kit .cta p{color:#f4ead9;margin-bottom:16px}
#expertise-kit .cta .btn{background:#fff;color:var(--brown-d)}
#expertise-kit .cta .btn:hover{background:var(--cream)}
#expertise-kit .obs{text-align:center;padding:22px;border:1px dashed var(--border2);border-radius:14px;color:var(--text);background:var(--cream);margin-bottom:20px}
#expertise-kit .obs b{color:var(--brown-d)}
#expertise-kit .report-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
#expertise-kit .report-actions .btn{flex:1;min-width:190px}

 d1:{titulo:'Liste 3 situações difíceis que você já resolveu',tempo:'10 min',

 d3:{titulo:'Monte o mapa do seu conhecimento',tempo:'15 min',

   {k:'check',id:'x5_pasta',txt:'Juntei esses materiais em uma única pasta'}]},
 d6:{titulo:'Defina o seu ritmo e o seu formato',tempo:'5 min',
  porque:'Um plano realista, no seu ritmo, tem muito mais chance de sair do papel.',dica:'',
  blocos:[

 {id:1,cor:'green',emoji:'🟢',nome:'EXPERTISE PRONTA PARA VIRAR MINICURSO',faixa:'38 a 48 pontos',min:38,

 {id:2,cor:'yellow',emoji:'🟡',nome:'QUASE PRONTA: FALTA ORGANIZAR',faixa:'28 a 37 pontos',min:28,
  resumo:'Você domina o assunto, mas ainda precisa organizar e registrar parte do que sabe.',
  acao:['Faça os primeiros passos abaixo: são exatamente as suas lacunas','Reúna e organize o que você já tem registrado','Escolha um recorte: um só público e um só problema','Refaça este diagnóstico em algumas semanas']},
 {id:3,cor:'orange',emoji:'🟠',nome:'EM FORMAÇÃO: HORA DE EXPLICITAR',faixa:'16 a 27 pontos',min:16,
  resumo:'Há muito conhecimento aí dentro, mas boa parte ainda está “na cabeça” e nas mãos. É hora de colocar em palavras.',
  acao:['Comece pelos exercícios abaixo: eles transformam o que você sabe em palavras','Explique o seu método em passos simples, como para um iniciante','Conte casos reais: são o seu melhor material','Só depois pense em formato e gravação']},
 {id:4,cor:'red',emoji:'🔴',nome:'AINDA MUITO TÁCITA: COMECE PELO REGISTRO',faixa:'0 a 15 pontos',min:0,
  resumo:'Isso não significa pouco conhecimento: significa que ele ainda não foi colocado em palavras. O melhor começo é registrar.',
  acao:['Fale ou escreva sobre o que você faz, sem se preocupar com a forma','Converse com alguém que já pediu a sua ajuda e anote as perguntas dela','Faça os exercícios abaixo, um por vez, sem pressa','Refaça este diagnóstico depois de registrar os primeiros materiais']}
];
var LEVELS=[
 {max:33,cor:'red',nome:'Predominantemente tácita',txt:'O que você sabe está, em grande parte, na prática e na intuição. Ainda é difícil de explicar a outras pessoas, e é justamente aí que está o maior valor a ser organizado.'},
 {max:66,cor:'yellow',nome:'Em transição',txt:'Parte do seu conhecimento já foi colocada em palavras; parte ainda vive só na prática. Continue explicitando: passos, casos reais e erros comuns.'},
 {max:100,cor:'green',nome:'Já bastante explícita',txt:'Você já consegue explicar, organizar e registrar o que sabe. Isso é a base de qualquer minicurso.'}
];

var S=loadState();
var armed={};

function blankPlan(){ return {tasks:{},fields:{},lists:{},choices:{}}; }
function newExp(nome){ return {id:'e'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nome:nome,ans:{},done:false,plan:blankPlan(),openAdj:{},hist:[],histKey:''}; }
function loadState(){
  var base={exps:[],cur:-1,step:0,view:'welcome',tmp:''}, saved=null, i;
  try{saved=JSON.parse(window.localStorage.getItem(KEY)||'null');}catch(e){saved=null;}
  if(saved&&typeof saved==='object'&&saved.exps&&typeof saved.exps.length==='number'){
    base.exps=saved.exps; base.cur=(typeof saved.cur==='number')?saved.cur:-1; base.step=saved.step||0; base.tmp=saved.tmp||'';
    for(i=0;i<base.exps.length;i++){
      var e=base.exps[i]; e.ans=e.ans||{}; e.plan=e.plan||blankPlan(); e.plan.tasks=e.plan.tasks||{}; e.plan.fields=e.plan.fields||{}; e.plan.lists=e.plan.lists||{}; e.plan.choices=e.plan.choices||{}; e.openAdj=e.openAdj||{}; e.hist=e.hist||[];
    }
    if(base.cur>=base.exps.length) base.cur=base.exps.length-1;
  }
  return base;
}
function save(){ try{window.localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function storageOk(){ try{var t='__t';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);return true;}catch(e){return false;} }

function $(id){ return byId(id); }
var APP=$('app'), VIEW=$('view');

function E(){ return S.exps[S.cur]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ansKey(d,i){ return d+'_'+i; }
function dimScore(e,d){ var t=0; for(var i=0;i<d.itens.length;i++){ var v=e.ans[ansKey(d.id,i)]; if(typeof v==='number') t+=v; } return t; }
function dimById(id){ for(var i=0;i<DIMS.length;i++){ if(DIMS[i].id===id) return DIMS[i]; } return null; }
function total(e){ var t=0; for(var i=0;i<DIMS.length;i++) t+=dimScore(e,DIMS[i]); return t; }
function answered(e){ var n=0; for(var k in e.ans){ if(typeof e.ans[k]==='number') n++; } return n; }
function totalItems(){ var n=0; for(var i=0;i<DIMS.length;i++) n+=DIMS[i].itens.length; return n; }
function maxScore(){ return totalItems()*2; }
function dimAnswered(e,d){ var n=0; for(var i=0;i<d.itens.length;i++){ if(typeof e.ans[ansKey(d.id,i)]==='number') n++; } return n; }
function bandOf(sc){ for(var i=0;i<BANDS.length;i++){ if(sc>=BANDS[i].min) return BANDS[i]; } return BANDS[BANDS.length-1]; }
function firstIncomplete(e){ for(var i=0;i<DIMS.length;i++){ if(dimAnswered(e,DIMS[i])<DIMS[i].itens.length) return i; } return -1; }
function explicitPct(e){ var t=0,m=0; for(var i=0;i<EXPL.length;i++){ var d=dimById(EXPL[i]); t+=dimScore(e,d); m+=d.itens.length*2; } return Math.round(t/m*100); }
function levelOf(p){ for(var i=0;i<LEVELS.length;i++){ if(p<=LEVELS[i].max) return LEVELS[i]; } return LEVELS[LEVELS.length-1]; }
function tone(score,max){ var r=score/max; return r>=0.75?'green':(r>=0.5?'yellow':'red'); }
function weakDims(e){
  var arr=DIMS.slice(), out=[], i;
  arr.sort(function(a,b){ var sa=dimScore(e,a), sb=dimScore(e,b); if(sa!==sb) return sa-sb; return PRI.indexOf(a.id)-PRI.indexOf(b.id); });
  for(i=0;i<arr.length&&out.length<3;i++){ if(dimScore(e,arr[i])<arr[i].itens.length*2) out.push(arr[i]); }
  return out;
}

function mapRow(e,i,actions){
  var done=e.done, sc=total(e), b=bandOf(sc), h='';
  h+='<div class="mrow band-'+(done?b.cor:'yellow')+'"><div><div class="mn">'+esc(e.nome)+'</div><div class="ms">'
   +(done?(b.emoji+' '+sc+' / '+maxScore()+' pontos · tácito → explícito: '+explicitPct(e)+'%'):('Em andamento · '+answered(e)+' de '+totalItems()+' afirmações respondidas'))+'</div></div>';
  if(actions) h+='<div class="mb"><button type="button" class="btn btn-primary btn-sm" data-act="open" data-i="'+i+'">'+(done?'Ver resultado':'Continuar')+'</button><button type="button" class="btn btn-ghost btn-sm" data-act="del" data-i="'+i+'">Remover</button></div>';
  if(done) h+='<div class="mbar"><i style="width:'+Math.round(sc/maxScore()*100)+'%"></i></div>';
  return h+'</div>';
}
function viewWelcome(){
  var h='', i;
  if(S.exps.length){

/* ---------- PLANO (exercícios) ---------- */
function planStats(e){
  var wd=weakDims(e), done=0, tot=0, P=e.plan, i, j;
  for(i=0;i<wd.length;i++){
    var bl=EXS[wd[i].id].blocos;
    for(j=0;j<bl.length;j++){
      var x=bl[j]; tot++;
      if(x.k==='check'){ if(P.tasks[x.id]) done++; }
      else if(x.k==='field'){ if((P.fields[x.id]||'').replace(/\s/g,'')) done++; }
      else if(x.k==='list'){ if((P.lists[x.id]||[]).length>0) done++; }
      else if(x.k==='choice'){ if(P.choices[x.id]) done++; }
    }
  }
  return {done:done,total:tot};
}

/* ---------- resumo (cópia / impressão) ---------- */
function planLines(e){
  var out=[], P=e.plan, wd=weakDims(e), i, j, k;
  for(i=0;i<wd.length;i++){
    var x=EXS[wd[i].id]; out.push({t:'h',v:(i+1)+'. '+x.titulo+' ('+wd[i].nome+')'});
    for(j=0;j<x.blocos.length;j++){
      var y=x.blocos[j];
      if(y.k==='check') out.push({t:'c',v:y.txt,on:!!P.tasks[y.id]});
      if(y.k==='field') out.push({t:'f',lab:y.label||'',v:(P.fields[y.id]||'').trim()});
      if(y.k==='choice') out.push({t:'f',lab:y.label||'',v:P.choices[y.id]||''});
      if(y.k==='list'){ var ls=P.lists[y.id]||[]; out.push({t:'l',lab:y.label||''}); if(!ls.length) out.push({t:'n',v:'(ainda não preenchido)'}); for(k=0;k<ls.length;k++) out.push({t:'n',v:(k+1)+'. '+ls[k]}); }
    }
  }
  return out;
}
function summaryText(){
  var e=E(), sc=total(e), max=maxScore(), b=bandOf(sc), st=planStats(e), p=explicitPct(e), lv=levelOf(p), L=[], i, j, groups=adjustGroups(e);

  for(i=0;i<groups.length;i++) L.push('- '+groups[i].d.nome+': '+groups[i].score+'/'+(groups[i].d.itens.length*2));
  L.push('','O QUE AJUSTAR'); var any=false;
  for(i=0;i<groups.length;i++){ var g=groups[i]; if(!g.zeros.length&&!g.partials.length) continue; any=true; L.push(g.d.nome+':');
    for(j=0;j<g.zeros.length;j++) L.push('  ✘ '+g.zeros[j]); for(j=0;j<g.partials.length;j++) L.push('  ◐ '+g.partials[j]); }
  if(!any) L.push('Tudo foi atendido plenamente.');
  L.push('','AÇÃO RECOMENDADA'); for(i=0;i<b.acao.length;i++) L.push('- '+b.acao[i]);
  L.push('','PRIMEIROS PASSOS ('+st.done+' de '+st.total+' tarefas concluídas)');

    if(x.t==='h') L.push('',x.v);
    else if(x.t==='c') L.push('  ['+(x.on?'x':' ')+'] '+x.v);
    else if(x.t==='n') L.push('    '+x.v);
    else if(x.t==='l'){ if(x.lab) L.push('  '+x.lab); }
    else if(x.t==='f'){ if(x.lab) L.push('  '+x.lab); L.push('    → '+(x.v||'(ainda não preenchido)')); }
  }
  var dl=doneList();
  if(dl.length>=2){ L.push('','MAPA DAS MINHAS EXPERTISES'); for(i=0;i<dl.length;i++){ var ex=S.exps[dl[i]]; L.push('- '+ex.nome+': '+total(ex)+'/'+max+' ('+explicitPct(ex)+'% explícito)'+(dl[i]===bestIndex()?'  ← mais pronta agora':'')); } }
  L.push('','Todo saber de quem tem anos de estrada começa tácito. Explicitá-lo é um trabalho de organização, e é isso que torna a experiência ensinável.');
  return L.join('\n');
}
function summaryHTML(){
  var e=E(), sc=total(e), max=maxScore(), b=bandOf(sc), st=planStats(e), p=explicitPct(e), lv=levelOf(p), h='', i, j, groups=adjustGroups(e);
  h+='<div class="ps"><div class="ps-t">Diagnóstico Rápido de Expertise</div><div class="ps-s">Expertise: '+esc(e.nome)+' · '+esc(today())+'</div>';
  h+='<div class="ps-score">'+sc+' / '+max+' — '+esc(b.nome)+'</div><div>'+esc(b.faixa)+'. '+esc(b.resumo)+'</div>';
  h+='<h4>Termômetro: do saber tácito ao explícito</h4><div><b>'+p+'% — '+esc(lv.nome)+'.</b> '+esc(lv.txt)+'</div>';
  h+='<h4>Perfil por dimensão</h4><ul>'; for(i=0;i<groups.length;i++) h+='<li>'+esc(groups[i].d.nome)+': <b>'+groups[i].score+'/'+(groups[i].d.itens.length*2)+'</b></li>'; h+='</ul>';
  h+='<h4>O que ajustar</h4>'; var any=false;
  for(i=0;i<groups.length;i++){ var g=groups[i]; if(!g.zeros.length&&!g.partials.length) continue; any=true; h+='<div><b>'+esc(g.d.nome)+'</b><ul>';
    for(j=0;j<g.zeros.length;j++) h+='<li>✘ '+esc(g.zeros[j])+'</li>'; for(j=0;j<g.partials.length;j++) h+='<li>◐ '+esc(g.partials[j])+'</li>'; h+='</ul></div>'; }
  if(!any) h+='<div>Tudo foi atendido plenamente.</div>';
  h+='<h4>Ação recomendada</h4><ul>'; for(i=0;i<b.acao.length;i++) h+='<li>→ '+esc(b.acao[i])+'</li>'; h+='</ul>';
  h+='<h4>Primeiros passos ('+st.done+' de '+st.total+' tarefas concluídas)</h4>';
  var pl=planLines(e);
  for(i=0;i<pl.length;i++){ var x=pl[i];
    if(x.t==='h') h+='<div style="margin-top:8px"><b>'+esc(x.v)+'</b></div>';
    else if(x.t==='c') h+='<div>'+(x.on?'☑':'☐')+' '+esc(x.v)+'</div>';
    else if(x.t==='n') h+='<div style="margin-left:14px">'+esc(x.v)+'</div>';
    else if(x.t==='l'){ if(x.lab) h+='<div><i>'+esc(x.lab)+'</i></div>'; }
    else if(x.t==='f'){ if(x.lab) h+='<div><i>'+esc(x.lab)+'</i></div>'; h+='<div class="txt">'+(x.v?esc(x.v):'(ainda não preenchido)')+'</div>'; }
  }
  var dl=doneList();
  if(dl.length>=2){ h+='<h4>Mapa das minhas expertises</h4><ul>'; for(i=0;i<dl.length;i++){ var ex=S.exps[dl[i]]; h+='<li>'+esc(ex.nome)+': <b>'+total(ex)+'/'+max+'</b> ('+explicitPct(ex)+'% explícito)'+(dl[i]===bestIndex()?' ← mais pronta agora':'')+'</li>'; } h+='</ul>'; }
  h+='<p style="margin-top:14px;font-size:12px;color:#666">Todo saber de quem tem anos de estrada começa tácito. Explicitá-lo é um trabalho de organização, e é isso que torna a experiência ensinável.</p></div>';
  return h;
}
function fillPrint(){ var el=$('printSum'); if(el) el.innerHTML=summaryHTML(); }
function copyText(text){
  var ok=function(){toast('✅ Diagnóstico copiado!');};
  var fallback=function(){
    try{
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
      APP.appendChild(ta); ta.select(); var r=document.execCommand('copy'); APP.removeChild(ta);
      if(r) ok(); else toast('Não foi possível copiar automaticamente. Use “Imprimir / Salvar PDF”.');
    }catch(e){ toast('Não foi possível copiar automaticamente. Use “Imprimir / Salvar PDF”.'); }
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,fallback); } else { fallback(); }
}

/* ---------- render / navegação ---------- */
function render(){
  setHero();
  VIEW.innerHTML = S.view==='check' ? viewCheck() : (S.view==='result' ? viewResult() : viewWelcome());
  if(S.view==='result'){ fillPrint(); }
  save();
}
function go(view,step){ S.view=view; if(typeof step==='number') S.step=step; render(); toTop(); }
function finishCheck(){
  var e=E(), key=JSON.stringify(e.ans);
  if(e.histKey!==key){ e.hist.push({s:total(e),d:today()}); e.histKey=key; }
  e.done=true; go('result');
}
function nextStep(){
  var e=E(), d=DIMS[S.step], miss=[], i;
  for(i=0;i<d.itens.length;i++){ if(typeof e.ans[ansKey(d.id,i)]!=='number') miss.push(i); }
  if(miss.length){
    for(i=0;i<d.itens.length;i++){ var el=$('it_'+d.id+'_'+i); if(el){ if(miss.indexOf(i)>=0) el.classList.add('missing'); else el.classList.remove('missing'); } }
    var w=$('warn'); w.textContent='Responda todas as afirmações para continuar. Faltam '+miss.length+(miss.length===1?' afirmação':' afirmações')+' nesta dimensão.'; w.classList.add('show');
    var first=$('it_'+d.id+'_'+miss[0]); if(first){ try{first.scrollIntoView({behavior:'smooth',block:'center'});}catch(e2){} }
    return;
  }
  if(S.step<DIMS.length-1){ go('check',S.step+1); } else { finishCheck(); }
}
function armBtn(el,key,label){
  if(armed[key]&&Date.now()-armed[key]<4500){ armed[key]=0; return true; }
  armed[key]=Date.now(); var old=el.textContent; el.textContent=label;
  setTimeout(function(){ armed[key]=0; if(el&&el.parentNode) el.textContent=old; },4500);
  return false;
}
function resetAll(){ S.exps=[]; S.cur=-1; S.step=0; S.tmp=''; S.view='welcome'; render(); toTop(); }

/* ---------- eventos ---------- */
APP.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el||!APP.contains(el)) return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id'), i, cur;
  if(act==='chk'||act==='fld'||act==='nome') return;
  if(act==='start'){
    var inp=$('nomeExp'), nm=((inp&&inp.value)||S.tmp||'').trim();
    if(!nm){ var wn=$('warnName'); if(wn) wn.classList.add('show'); if(inp) inp.focus(); return; }
    S.exps.push(newExp(nm)); S.cur=S.exps.length-1; S.tmp=''; go('check',0);
  }
  else if(act==='open'){ S.cur=parseInt(el.getAttribute('data-i'),10); var ex=E(); if(ex.done) go('result'); else { var inc=firstIncomplete(ex); go('check',inc<0?0:inc); } }
  else if(act==='del'){
    var di=parseInt(el.getAttribute('data-i'),10);
    if(armBtn(el,'del'+di,'Confirmar?')){ S.exps.splice(di,1); S.cur=S.exps.length?Math.min(S.cur,S.exps.length-1):-1; render(); }
  }
  else if(act==='reset'){ if(armBtn(el,'reset','Clique de novo para apagar tudo')) resetAll(); }
  else if(act==='back'){ if(S.step>0) go('check',S.step-1); else go('welcome'); }
  else if(act==='next'){ nextStep(); }
  else if(act==='ans'){
    cur=E(); var d=el.getAttribute('data-d'), idx=el.getAttribute('data-i'), v=parseInt(el.getAttribute('data-v'),10);
    cur.ans[d+'_'+idx]=v;
    var box=el.parentNode.querySelectorAll('.opt'); for(i=0;i<box.length;i++){ var on=(box[i]===el); box[i].classList.toggle('on',on); box[i].setAttribute('aria-pressed',on?'true':'false'); }
    var item=$('it_'+d+'_'+idx); if(item) item.classList.remove('missing');
    var w=$('warn'); if(w&&!VIEW.querySelector('.item.missing')) w.classList.remove('show');
    updateCheckMeta(); save();
  }
  else if(act==='adj'){
    var dd=el.getAttribute('data-d'), box2=$('adj_'+dd), isOpen=box2.classList.toggle('open'); E().openAdj[dd]=isOpen; save();
  }
  else if(act==='choice'){
    E().plan.choices[id]=el.getAttribute('data-v');
    var sib=el.parentNode.querySelectorAll('.chip'); for(i=0;i<sib.length;i++){ var o=(sib[i]===el); sib[i].classList.toggle('on',o); sib[i].setAttribute('aria-pressed',o?'true':'false'); }
    refreshPlanProgress(); save();
  }
  else if(act==='ladd'){
    var inp2=$('li_'+id), val=(inp2.value||'').trim(); if(!val){ inp2.focus(); return; }
    var arr=E().plan.lists[id]=E().plan.lists[id]||[]; arr.push(val); inp2.value='';
    $('list_'+id).innerHTML=listInner(id); refreshPlanProgress(); save(); inp2.focus();
  }
  else if(act==='ldel'||act==='lup'||act==='ldown'){
    var a2=E().plan.lists[id]||[], k=parseInt(el.getAttribute('data-i'),10);
    if(act==='ldel') a2.splice(k,1);
    else if(act==='lup'&&k>0){ var t1=a2[k-1]; a2[k-1]=a2[k]; a2[k]=t1; }
    else if(act==='ldown'&&k<a2.length-1){ var t2=a2[k+1]; a2[k+1]=a2[k]; a2[k]=t2; }
    $('list_'+id).innerHTML=listInner(id); refreshPlanProgress(); save();
  }
  else if(act==='copy'){ copyText(summaryText()); }
  else if(act==='print'){ fillPrint(); window.print(); }
  else if(act==='other'){ go('welcome'); }
  else if(act==='reapply'){ cur=E(); cur.ans={}; cur.done=false; go('check',0); }
});
APP.addEventListener('change',function(e){
  var el=e.target; if(!el.getAttribute||el.getAttribute('data-act')!=='chk') return;
  E().plan.tasks[el.getAttribute('data-id')]=!!el.checked;
  var row=el.closest('.chk-row'); if(row) row.classList.toggle('on',!!el.checked);
  refreshPlanProgress(); save();
});
APP.addEventListener('input',function(e){
  var el=e.target; if(!el.getAttribute) return; var act=el.getAttribute('data-act');
  if(act==='nome'){ S.tmp=el.value; var wn=$('warnName'); if(wn&&el.value.trim()) wn.classList.remove('show'); save(); }
  else if(act==='fld'){ E().plan.fields[el.getAttribute('data-id')]=el.value; refreshPlanProgress(); save(); }
});
APP.addEventListener('keydown',function(e){
  var el=e.target; if(e.key!=='Enter'||!el.getAttribute) return;
  var id=el.getAttribute('data-lin');
  if(id){ e.preventDefault(); var b=VIEW.querySelector('[data-act="ladd"][data-id="'+id+'"]'); if(b) b.click(); return; }
  if(el.getAttribute('data-act')==='nome'){ e.preventDefault(); var sb=VIEW.querySelector('[data-act="start"]'); if(sb) sb.click(); }
});

/* início: sempre mostra a boas-vindas (com os diagnósticos salvos, se houver) */
S.view='welcome';
render();
